# Dependabot Security & Version Update Configuration
# Automatic vulnerability scanning and dependency patching for npm packages
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    reviewers:
      - "FransApris"
    assignees:
      - "FransApris"
    commit-message:
      prefix: "security(deps)"
      include: "scope"
    ignore:
      - dependency-name: "nuxt"
        update-types: ["version-update:semver-major"]
